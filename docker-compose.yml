services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: guard
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: guard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
volumes:
  pgdata: